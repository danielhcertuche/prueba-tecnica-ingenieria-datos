[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-clima"
version = "1.0.0"
description = "Prueba técnica de ingeniería de datos: modelo relacional y ETL de normales climatológicas"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "matplotlib>=3.8",
]

[project.scripts]
etl-clima = "etl_clima.pipeline:main"
etl-clima-reporte = "etl_clima.reporte:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
